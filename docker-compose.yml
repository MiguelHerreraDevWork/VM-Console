services:
  db:
    image: postgres:16
    container_name: ifx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ifx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ifx_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ifx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ifx_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ifx_pg_data:
